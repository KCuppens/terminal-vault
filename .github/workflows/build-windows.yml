name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sshd for the session integration tests
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: cargo fmt --check
      - run: cargo clippy -p tvcore --all-targets -- -D warnings
      - run: cargo test -p tvcore
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  shell:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: cargo test -p tvcore
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-vault-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
