[package]
name = "tvcore"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "tvcore"

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
rand = { version = "0.10", features = ["thread_rng"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
